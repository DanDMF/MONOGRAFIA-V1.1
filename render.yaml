# Blueprint do Render: um serviço web (Docker) + base PostgreSQL. Instruções: docs/DEPLOY.md
# Planos e preços mudam: confirme no Render antes de criar (o plano gratuito tem limites de memória e de duração da base).
services:
  - type: web
    name: vrban
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vrban-db
          property: connectionString
      - key: MIGRATE_ON_START
        value: "true"
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
      - key: STORAGE_DRIVER
        value: db
      - key: PUBLIC_PROJECT_SLUG
        value: vrban
      - key: VRBAN_BOOTSTRAP_EMAIL
        sync: false # o seu email de acesso
      - key: VRBAN_BOOTSTRAP_NAME
        sync: false # o seu nome
      - key: VRBAN_BOOTSTRAP_PASSWORD
        sync: false # palavra-passe com 12+ caracteres; apagar depois do primeiro arranque
databases:
  - name: vrban-db
    plan: free
    databaseName: vrban
    user: vrban
